# To activate this workflow, copy it to .github/workflows/ at the repository root
# (GitHub only runs workflows from that folder).
name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: agent-saifu-core
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: agent-saifu-core.exe
          - name: macos
            os: macos-latest
            target: aarch64-apple-darwin
            binary: agent-saifu-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build release executable
        working-directory: core
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package zip (executable + spec.md)
        shell: bash
        run: |
          out="agent-saifu-${{ matrix.name }}"
          mkdir "$out"
          cp "core/target/${{ matrix.target }}/release/${{ matrix.binary }}" "$out/"
          cp spec.md "$out/"
          if [ "${{ matrix.name }}" = "windows" ]; then
            7z a -tzip "$out.zip" "./$out/*"
          else
            (cd "$out" && zip -r "../$out.zip" .)
          fi

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: agent-saifu-${{ matrix.name }}
          path: agent-saifu-${{ matrix.name }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach zips to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
