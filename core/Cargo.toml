[package]
name = "agent-saifu-core"
version = "0.0.0"
description = "All-in-one crypto wallet for Agents. Built from the ground up in Rust."
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
chacha20poly1305 = "0.11"
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
k256 = { version = "0.14.0", features = ["ecdsa", "arithmetic"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sui-crypto = { version = "0.4", default-features = false, features = ["ed25519", "bech32"] }
sui-sdk-types = { version = "0.4", features = ["serde", "hash"] }
sui-transaction-builder = { version = "0.4", default-features = false }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
webpki-roots = "1"
x25519-dalek = { version = "3", default-features = false, features = ["zeroize", "static_secrets"] }

[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
