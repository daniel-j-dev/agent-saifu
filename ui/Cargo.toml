[package]
name = "agent-saifu-ui"
version = "0.0.0"
description = "Dioxus app (desktop, Android, iOS) for agent-saifu. The wallet itself lives in ../core."
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
agent-saifu-core = { path = "../core" }
dioxus = { version = "0.7.10", features = [] }
futures-channel = "0.3"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", default-features = false, features = ["time"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Replaces the wallet with canned data so the screens can be reviewed without keys or a network.
demo = []

[profile.dev]
opt-level = 2

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
